<div class="login-container pl-3 pr-3">
    <!-- <div class=" text-center"> -->

    <div class="loginDiv" style="background-color: #ffffff;">

        <div class="headerDiv p-2">

            <h1 class="font-weight-bold pt-4 d-flex align-items-center justify-content-center headerText"
                style="color: #ffffff;">
                🧑‍💻 StaffUnity</h1>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="p-4">
            <mat-form-field appearance="outline" class="col-12 pl-0 pr-0">
                <mat-label>Email</mat-label>
                <input type="email" matInput formControlName="email">
            </mat-form-field>
            <mat-form-field appearance="outline" class="col-12 pl-0 pr-0">
                <mat-label>Password</mat-label>
                <input type="text" matInput formControlName="passwordHash">
            </mat-form-field>

            <!-- <h4 class="text-right" style="color: #3f51b5; text-decoration: underline;font-weight: bold;"
                (click)="addUser()">Create Account</h4> -->
            <!-- <div class="captcha-full">
                <ngx-recaptcha2 data-size="compact" #captchaElem [siteKey]="siteKey" formControlName="recaptcha">
                </ngx-recaptcha2>
            </div> -->



            <div class="d-flex pt-4">
                <button mat-raised-button color="primary" type="submit" class="col mr-2">Login</button>
                <button mat-raised-button color="warn" type="button" class="col" (click)="resetForm()">Cancel</button>
            </div>

        </form>
        <div class="pb-4">

            <small class="d-block text-center pt-2">*Admin email: <b>emsbackend.mailer@gmail.com</b></small>
            <small class="d-block text-center pt-2">*All users share the default password: <b>12345</b></small>

        </div>
    </div>
    <!-- </div> -->
</div>
